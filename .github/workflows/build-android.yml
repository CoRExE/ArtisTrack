name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🧅 Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🗄️ Ensure SQLite database is present
        run: |
          if [ ! -f "assets/data/artis.db" ]; then
            echo "[+] assets/data/artis.db absent, génération depuis GTFS transport.data.gouv.fr..."
            python3 scripts/build-db.py
          else
            echo "[+] assets/data/artis.db déjà présent."
          fi

      - name: 🔑 Configure signing credentials
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "[+] Utilisation du keystore release configuré dans les secrets GitHub"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            cat <<EOF > credentials.json
          {
            "android": {
              "keystore": {
                "keystorePath": "release.keystore",
                "keystorePassword": "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}",
                "keyAlias": "${{ secrets.ANDROID_KEY_ALIAS }}",
                "keyPassword": "${{ secrets.ANDROID_KEY_PASSWORD }}"
              }
            }
          }
          EOF
          else
            echo "[+] Génération automatique d'un keystore de test pour signer l'APK"
            keytool -genkeypair -v -keystore release.keystore -alias artistrack -keyalg RSA -keysize 2048 -validity 10000 -storepass artistrack123 -keypass artistrack123 -dname "CN=ArtisTrack, OU=Mobile, O=ArtisTrack, L=Arras, ST=Pas-de-Calais, C=FR"
            cat <<EOF > credentials.json
          {
            "android": {
              "keystore": {
                "keystorePath": "release.keystore",
                "keystorePassword": "artistrack123",
                "keyAlias": "artistrack",
                "keyPassword": "artistrack123"
              }
            }
          }
          EOF
          fi

      - name: ⚙️ Expo Prebuild Android
        run: bunx expo prebuild --platform android --clean

      - name: 🔨 Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 🏷️ Prepare APK Artifact
        id: apk_info
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "${{ github.ref_type }}" != "tag" ]; then
            VERSION="manual-${{ github.run_number }}"
          fi
          APK_NAME="ArtisTrack-${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          echo "apk_path=$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "[+] APK généré avec succès :"
          ls -lh "$APK_NAME"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk_info.outputs.apk_name }}
          path: ${{ steps.apk_info.outputs.apk_path }}
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk_info.outputs.apk_path }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
